<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUTURE POINTS | ログイン</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css?v=1.2">
  <link rel="icon" href="assets/images/favicon.png" type="image/png">
</head>
<body>

  <!-- Theme Toggle (fixed top-right) -->
  <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()"
    style="position: fixed; top: 1rem; right: 1rem; z-index: 100;">
    <span class="theme-toggle-label">🌙 ダーク</span>
  </button>


  <div class="auth-container glass-panel" id="auth-panel">
    <h1>FUTURE POINTS</h1>
    <p id="auth-subtitle">ログインしてポイントを獲得しよう</p>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">ユーザー名 または メールアドレス</label>
        <input type="text" id="login-email" class="form-control" placeholder="ユーザー名 / user@example.com" required>
      </div>
      <div class="form-group">
        <label for="login-password">パスワード</label>
        <div style="position: relative;">
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          <span class="password-toggle" onclick="togglePasswordVisibility('login-password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.2rem; user-select: none;" title="パスワードを表示">👁️</span>
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-4">ログイン</button>
      <p class="mt-4 text-center">
        アカウントをお持ちでないですか？ <span class="toggle-auth" onclick="toggleAuthMode()">新規登録</span>
      </p>
    </form>

    <!-- Signup Form (Hidden by default) -->
    <form id="signup-form" style="display: none;">
      <div class="form-group">
        <label for="signup-name">お名前</label>
        <input type="text" id="signup-name" class="form-control" placeholder="山田 太郎" required>
      </div>
      <div class="form-group">
        <label for="signup-email">メールアドレス</label>
        <input type="email" id="signup-email" class="form-control" placeholder="user@example.com" required>
      </div>
      <div class="form-group">
        <label for="signup-password">パスワード</label>
        <div style="position: relative;">
          <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
          <span class="password-toggle" onclick="togglePasswordVisibility('signup-password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.2rem; user-select: none;" title="パスワードを表示">👁️</span>
        </div>
      </div>
      <div class="form-group">
        <label for="signup-grade">学年</label>
        <select id="signup-grade" class="form-control" required>
          <option value="" disabled selected>学年を選択してください</option>
          <option value="1">1年生</option>
          <option value="2">2年生</option>
          <option value="3">3年生</option>
        </select>
      </div>
      <div class="form-group">
        <label for="signup-class">組</label>
        <select id="signup-class" class="form-control" required>
          <option value="" disabled selected>組を選択してください</option>
          <option value="1">1組</option>
          <option value="2">2組</option>
          <option value="3">3組</option>
          <option value="4">4組</option>
          <option value="5">5組</option>
          <option value="6">6組</option>
          <option value="7">7組</option>
          <option value="8">8組</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary mt-4">アカウント作成</button>
      <p class="mt-4 text-center">
        すでにアカウントをお持ちですか？ <span class="toggle-auth" onclick="toggleAuthMode()">ログイン</span>
      </p>
    </form>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script defer src="assets/js/firebase-config.js?v=1.1"></script>
  <script defer src="assets/js/theme.js?v=1.0"></script>
  <script defer src="assets/js/auth.js?v=1.5"></script>
</body>
</html>
