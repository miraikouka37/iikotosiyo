<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUTURE POINTS | 設定</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css?v=1.3">
  <link rel="icon" href="assets/images/favicon.png" type="image/png">
</head>
<body style="padding-top: 0;">

  <div class="dashboard-container">
    <header class="header">
      <h2 style="margin: 0;">アカウント設定</h2>
      <div class="nav-user">
        <button class="theme-toggle-btn" onclick="toggleTheme()">
          <span class="theme-toggle-label">🌙 ダーク</span>
        </button>
        <button class="btn btn-outline btn-sm" onclick="goBack()">戻る</button>
        <button class="btn btn-outline btn-sm" onclick="logout()">ログアウト</button>
      </div>
    </header>

    <div class="glass-panel" style="max-width: 600px; margin: 2rem auto;">
      <h3 class="section-title">プロフィール編集</h3>
      
      <form id="settings-form">
        <div class="form-group">
          <label for="settings-name">ユーザー名</label>
          <input type="text" id="settings-name" class="form-control" required>
        </div>
        
        <div class="form-group">
          <label for="settings-email" id="label-settings-email">メールアドレス <span id="label-settings-email-tag" style="font-size: 0.75rem; color: var(--accent); font-weight: normal;">(@mirai-th.open.ed.jp のみ)</span></label>
          <input type="text" id="settings-email" class="form-control" placeholder="user@mirai-th.open.ed.jp" required>
          <p id="settings-email-hint" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">※学校用のメールアドレス（@mirai-th.open.ed.jp）を入力してください</p>
        </div>
        
        <div class="form-group">
          <label for="settings-password">新しいパスワード (変更のみ入力)</label>
          <input type="password" id="settings-password" class="form-control" placeholder="••••••••">
        </div>

        <div class="form-group" id="settings-grade-group">
          <label for="settings-grade">学年</label>
          <select id="settings-grade" class="form-control">
            <option value="" disabled>学年を選択してください</option>
            <option value="1">1年生</option>
            <option value="2">2年生</option>
            <option value="3">3年生</option>
          </select>
        </div>

        <div class="form-group" id="settings-class-group">
          <label for="settings-class">組</label>
          <select id="settings-class" class="form-control">
            <option value="" disabled>組を選択してください</option>
            <option value="1">1組</option>
            <option value="2">2組</option>
            <option value="3">3組</option>
            <option value="4">4組</option>
            <option value="5">5組</option>
            <option value="6">6組</option>
            <option value="7">7組</option>
            <option value="8">8組</option>
          </select>
        </div>

        <!-- 画面表示設定 -->
        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--panel-border);">
          <label style="font-weight: 700; font-size: 0.85rem; color: var(--accent); margin-bottom: 0.75rem; display: block;">⚙️ 画面表示設定</label>
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 0.75rem; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--panel-border); border-radius: 10px;">
            <div style="flex: 1; padding-right: 1rem;">
              <div style="font-weight: 600; font-size: 0.875rem; color: var(--text-main);">ヘッダーのワッフルメニュー</div>
              <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.15rem;">ヘッダー上の「その他の機能」アイコン（9つの点）を表示します</div>
            </div>
            <label class="toggle-switch" style="position: relative; display: inline-block; width: 44px; height: 24px; cursor: pointer; flex-shrink: 0; margin: 0;">
              <input type="checkbox" id="settings-show-waffle" style="opacity: 0; width: 0; height: 0;">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary mt-4">変更を保存</button>
      </form>
    </div>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script defer src="assets/js/firebase-config.js?v=1.1"></script>
  <script defer src="assets/js/theme.js?v=1.0"></script>
  <script defer src="assets/js/settings.js?v=1.3"></script>
</body>
</html>
